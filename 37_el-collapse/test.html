<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue 3 CDN + Element Plus Collapse Demo</title>

    <!-- 1. 引入 Element Plus CSS 樣式 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/element-plus/dist/index.css"
    />

    <!-- 2. 引入 Vue 3 (全局變數版) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- 3. 引入 Element Plus JS -->
    <script src="https://unpkg.com/element-plus"></script>

    <!-- 4. 引入 Element Plus 圖示庫 (可選) -->
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>

    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        padding: 24px;
        background-color: #f5f7fa;
      }
      .demo-container {
        max-width: 800px;
        margin: 0 auto;
        background: #ffffff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
      }
      .control-panel {
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid #e4e7ed;
      }
      .status-box {
        margin-top: 20px;
        padding: 12px;
        background-color: #f4f4f5;
        border-radius: 4px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="app" class="demo-container">
      <h2>Element Plus 折疊面板 (Collapse) CDN 測試</h2>

      <!-- 控制面板：示範從外部用 JavaScript 修改 activeNames -->
      <div class="control-panel">
        <el-button type="primary" size="small" @click="expandAll"
          >全部展開</el-button
        >
        <el-button type="info" size="small" @click="collapseAll"
          >全部收合</el-button
        >
        <el-button type="success" size="small" @click="toggleAccordion">
          切換模式（目前：{{ isAccordion ? '單選/手風琴' : '多選' }}）
        </el-button>
      </div>

      <!-- Collapse 元件區塊 -->
      <el-collapse
        v-model="activeNames"
        :accordion="isAccordion"
        @change="handleChange"
      >
        <el-collapse-item title="Consistency (一致性)" name="1">
          <div>
            與現實生活一致：符合現實生活的流程與邏輯，遵循使用者習慣的語言和概念；
          </div>
          <div>
            介面內一致：所有的元素應保持一致，例如：設計風格、圖標和文字、元素的位置等。
          </div>
        </el-collapse-item>
      </el-collapse>

      <!-- 即時狀態顯示區塊 -->
      <div class="status-box">
        <strong>目前 activeNames 的值：</strong> {{ JSON.stringify(activeNames)
        }}
      </div>
    </div>

    <script>
      // CDN 環境下的 Composition API 解構用法
      const { createApp, ref } = Vue;

      const app = createApp({
        setup() {
          // 1. 綁定 activeNames（預設展開第 1 項）
          const activeNames = ref(["1"]);

          // 2. 是否開啟手風琴模式
          const isAccordion = ref(false);

          // 3. 事件處理：當使用者點擊展開/收合時觸發
          const handleChange = (val) => {
            console.log("Collapse 狀態變更 (activeNames):", val);
          };

          // 4. 外部控制函式：全部展開
          const expandAll = () => {
            if (isAccordion.value) {
              ElementPlus.ElMessage.warning("手風琴模式下無法同時全部展開");
              return;
            }
            activeNames.value = ["1", "2", "3", "4"];
          };

          // 5. 外部控制函式：全部收合
          const collapseAll = () => {
            activeNames.value = isAccordion.value ? "" : [];
          };

          // 6. 切換多選/單選模式
          const toggleAccordion = () => {
            isAccordion.value = !isAccordion.value;
            // 切換模式時重置展開狀態，避免型態不匹配 (陣列 vs 字串)
            activeNames.value = isAccordion.value ? "1" : ["1"];
          };

          return {
            activeNames,
            isAccordion,
            handleChange,
            expandAll,
            collapseAll,
            toggleAccordion,
          };
        },
      });

      // 掛載 Element Plus 套件
      app.use(ElementPlus);

      // 掛載 Vue App
      app.mount("#app");
    </script>
  </body>
</html>
