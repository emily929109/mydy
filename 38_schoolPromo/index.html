<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>開學季全配出發｜DUDUPAY</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="banner" id="banner">
      <img class="banner-bg" src="img/banner-bg.png" alt="" />

      <div class="banner-inner">
        <img
          class="decor item-headphone"
          data-speed="90"
          src="img/headphone.png"
          alt=""
        />
        <img
          class="decor item-gloves"
          data-speed="70"
          src="img/gloves.png"
          alt=""
        />
        <img
          class="decor item-hand"
          data-speed="48"
          src="img/hand.png"
          alt=""
        />
        <img
          class="decor item-circle2"
          data-speed="40"
          src="img/circle-2.png"
          alt=""
        />
        <img
          class="decor item-line1"
          data-speed="36"
          src="img/line-1.png"
          alt=""
        />
        <img
          class="decor item-line2"
          data-speed="42"
          src="img/line-2.png"
          alt=""
        />
        <img
          class="decor item-circle3"
          data-speed="34"
          src="img/circle-3.png"
          alt=""
        />

        <img
          class="banner-text"
          src="img/banner-text.png"
          alt="開學季全配出發，讓學習效率升級，把喜歡的裝備帶進新學期，活動日期 8/19～10/3"
        />

        <img
          class="decor item-watch"
          data-speed="110"
          src="img/watch.png"
          alt=""
        />
        <img
          class="decor item-notebook"
          data-speed="75"
          src="img/notebook.png"
          alt=""
        />
        <img
          class="decor item-helmet"
          data-speed="95"
          src="img/helmet.png"
          alt=""
        />
        <img
          class="decor item-airpod"
          data-speed="55"
          src="img/airpod.png"
          alt=""
        />
        <img
          class="decor item-circle1"
          data-speed="44"
          src="img/circle-1.png"
          alt=""
        />
        <img
          class="decor item-line3"
          data-speed="40"
          src="img/line-3.png"
          alt=""
        />
        <img
          class="decor item-line4"
          data-speed="36"
          src="img/line-4.png"
          alt=""
        />

        <img class="star item-star1" src="img/star-1.png" alt="" />
        <img class="star item-star2" src="img/star-2.png" alt="" />
      </div>
    </section>

    <main class="content">
      <section class="product-grid">
        <article class="product-card">
          <div class="product-image"></div>
          <p class="product-name">測試商品一</p>
          <p class="product-store">測試店家</p>
          <p class="product-price">$990</p>
        </article>
        <article class="product-card">
          <div class="product-image"></div>
          <p class="product-name">測試商品二</p>
          <p class="product-store">測試店家</p>
          <p class="product-price">$990</p>
        </article>
        <article class="product-card">
          <div class="product-image"></div>
          <p class="product-name">測試商品三</p>
          <p class="product-store">測試店家</p>
          <p class="product-price">$990</p>
        </article>
        <article class="product-card">
          <div class="product-image"></div>
          <p class="product-name">測試商品四</p>
          <p class="product-store">測試店家</p>
          <p class="product-price">$990</p>
        </article>
        <article class="product-card">
          <div class="product-image"></div>
          <p class="product-name">測試商品五</p>
          <p class="product-store">測試店家</p>
          <p class="product-price">$990</p>
        </article>
        <article class="product-card">
          <div class="product-image"></div>
          <p class="product-name">測試商品六</p>
          <p class="product-store">測試店家</p>
          <p class="product-price">$990</p>
        </article>
        <article class="product-card">
          <div class="product-image"></div>
          <p class="product-name">測試商品七</p>
          <p class="product-store">測試店家</p>
          <p class="product-price">$990</p>
        </article>
        <article class="product-card">
          <div class="product-image"></div>
          <p class="product-name">測試商品八</p>
          <p class="product-store">測試店家</p>
          <p class="product-price">$990</p>
        </article>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
