<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
      .modal-dialog {
        width: 50%;
        max-width: unset !important;
      }
      .modal.show .modal-dialog {
        height: 90vh;
      }

      .modal-content {
        height: 100%;
      }

      #pdf-container {
        height: 100%;
        overflow-y: auto;
      }

      #pdf-container canvas {
        display: block;
        margin: 0 auto 10px auto;
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
      }
      .modal-body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Button trigger modal -->
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal"
    >
      Launch demo modal
    </button>

    <!-- Modal -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div id="pdf-container"></div>
          </div>
          <div class="modal-footer">
            <div class="form-group form-check">
              <input
                class="form-check-input"
                id="agreement-check"
                type="checkbox"
                disabled
              />
              <label
                class="form-check-label"
                for="agreement-check"
                style="font-size: 1rem"
              >
                我已閱讀且同意隱私權政策
              </label>
            </div>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary">Save changes</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      // pdf.js套件的原理 : 把 pdf 每一頁個別 render 在 canvas
      // 用到的 API :
      // 1. pdfjsLib.getDocument(url) : 下載 pdf 並解析成一個物件 PDFDocumentProxy
      // 2. pdf.getPage(pageNum) :  針對某一頁，拿到該頁的繪圖資訊
      // 3. page.render({ canvasContext, viewport })
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const pdfUrl = { url: "test.pdf" };
      const pdfContainer = document.getElementById("pdf-container");
      const pdfModal = document.getElementById("exampleModal");
      const agreementCheck = document.getElementById("agreement-check");
      let pdfLoaded = false;

      // 判斷 pdf-container 是否已經滾動到底部（容許 1px 誤差）
      function isScrolledToBottom(el) {
        return Math.abs(el.scrollHeight - el.clientHeight - el.scrollTop) <= 1;
      }

      pdfContainer.addEventListener("scroll", function () {
        if (isScrolledToBottom(pdfContainer)) {
          agreementCheck.disabled = false;
        }
      });

      pdfModal.addEventListener("show.bs.modal", function () {
        // 每次打開 Modal 都重置勾選狀態，需重新滑到底才能打勾
        agreementCheck.checked = false;
        agreementCheck.disabled = true;

        // 檢查 PDF 是否已經載入過，避免重複載入
        if (pdfLoaded) return;
        pdfLoaded = true;

        pdfjsLib
          .getDocument(pdfUrl)
          .promise.then(function (pdf) {
            // renderTasks 裝每一頁 PDF 渲染流程的 Promise
            const renderTasks = [];

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
              renderTasks.push(
                pdf.getPage(pageNum).then(function (page) {
                  const viewport = page.getViewport({ scale: 1.5 });
                  const canvas = document.createElement("canvas");
                  const context = canvas.getContext("2d");
                  canvas.height = viewport.height;
                  canvas.width = viewport.width;

                  pdfContainer.appendChild(canvas);

                  return page.render({
                    canvasContext: context,
                    viewport: viewport,
                  }).promise;
                }),
              );
            }

            return Promise.all(renderTasks);
          })
          .then(function () {
            // 內容不夠長、根本不需要捲動時，直接允許打勾
            if (isScrolledToBottom(pdfContainer)) {
              agreementCheck.disabled = false;
            }
          })
          .catch(function (reason) {
            console.error("PDF 載入失敗:", reason);
          });
      });
    </script>
  </body>
</html>
