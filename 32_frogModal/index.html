<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- 觸發彈窗的按鈕（測試用） -->
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#registerModal"
    >
      模擬特約商呼叫 API 觸發彈窗
    </button>

    <div class="modal fade" id="registerModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered" style="max-width: 400px">
        <div
          class="modal-content border-0"
          style="
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
          "
        >
          <div class="position-absolute end-0 top-0 p-3" style="z-index: 1055">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body text-center p-5">
            <div
              class="mb-4 d-inline-flex align-items-center justify-content-center"
              style="
                width: 70px;
                height: 70px;
                background-color: #61bd9a;
                border-radius: 15px;
                color: #fff;
              "
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="36"
                height="36"
                fill="currentColor"
                class="bi bi-cart-plus"
                viewBox="0 0 16 16"
              >
                <path
                  d="M9 5.5a.5.5 0 0 0-1 0V7H6.5a.5.5 0 0 0 0 1H8v1.5a.5.5 0 0 0 1 0V8h1.5a.5.5 0 0 0 0-1H9z"
                />
                <path
                  d="M.5 1a.5.5 0 0 0 0 1h1.11l.401 1.607 1.498 7.985A.5.5 0 0 0 4 12h1a2 2 0 1 0 0 4 2 2 0 0 0 0-4h7a2 2 0 1 0 0 4 2 2 0 0 0 0-4h1a.5.5 0 0 0 .491-.408l1.5-8A.5.5 0 0 0 14.5 1H2.89l-.405-1.621A.5.5 0 0 0 2 0H.5zm3.915 10L3.102 4h10.796l-1.313 7zM6 14a1 1 0 1 1-2 0 1 1 0 0 1 2 0m7 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0"
                />
              </svg>
            </div>

            <h5 class="fw-bold mb-4">請先註冊會員</h5>

            <div class="d-grid mb-3">
              <button
                type="button"
                class="btn btn-success fw-bold text-white fs-5 border-0 shadow-lg"
                style="
                  background-color: #55b492;
                  border-radius: 12px;
                  padding-top: 1rem;
                  padding-bottom: 1rem;
                "
              >
                註冊並購買
              </button>
            </div>

            <p class="text-muted small px-3 mb-0">
              請先註冊會員，完成後即可進行購買。
            </p>

            <button
              type="button"
              class="btn btn-link text-decoration-none text-secondary btn-sm mt-3 text-decoration-underline"
              data-bs-dismiss="modal"
            >
              取消
            </button>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
